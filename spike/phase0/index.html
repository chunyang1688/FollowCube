<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>跟着还原魔方</title>
    <style>
      :root {
        --bg: #fff6ea;
        --card: #ffffff;
        --text: #2f343a;
        --muted: #7b8494;
        --primary: #ff8a5b;
        --primary-soft: #fff1e6;
        --danger: #e85d4c;
        --ok: #3cb371;
        --line: #f0e4d4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 16px 16px 32px;
      }
      .screen { display: none; }
      .screen.active { display: block; }
      h1 { margin: 12px 0 8px; font-size: 28px; }
      h2 { margin: 0; font-size: 16px; }
      .muted { color: var(--muted); font-size: 14px; line-height: 1.6; }
      .back {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 0;
        height: auto;
        font-size: 14px;
      }
      button, .swatch, .chip {
        font: inherit;
        cursor: pointer;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--text);
        height: 44px;
        padding: 0 16px;
      }
      button.primary { background: var(--primary); color: #fff; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
      #screen-follow .ops { flex-wrap: nowrap; }
      #screen-follow .ops button {
        flex: 1;
        min-width: 0;
        padding: 0 4px;
        height: 40px;
        font-size: 13px;
      }
      .row .grow { flex: 1; }
      .menu {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 12px 0;
        padding: 16px;
        background: var(--card);
        border-radius: 18px;
        border: 0;
        width: 100%;
        height: auto;
        text-align: left;
      }
      .menu b { display: block; font-size: 18px; margin-bottom: 4px; }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        flex: 0 0 auto;
      }
      .mark.fill { background: #ff8a5b; }
      .mark.cam { background: #6aa6ff; }
      .mark.practice { background: #f0a202; }
      .mark.go { background: #3cb389; }
      .stage {
        margin: 8px 0 12px;
        background: var(--bg);
        border-radius: 16px;
        overflow: hidden;
      }
      #paint-view, #view, #photo-canvas {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        background: var(--bg);
        touch-action: none;
      }
      #view { cursor: grab; }
      #view.orbiting, #photo-canvas.dragging { cursor: grabbing; }
      .palette { display: flex; justify-content: space-between; gap: 4px; margin: 8px 0 16px; }
      .chip, .swatch {
        border: 2px solid transparent;
        background: transparent;
        border-radius: 12px;
        padding: 6px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: var(--text);
        min-width: 44px;
      }
      .chip.on, .swatch.active { border-color: var(--primary); background: var(--primary-soft); }
      .dot, .swatch i {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.12);
        display: block;
      }
      .cam-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.12);
        display: grid;
        place-items: center;
        color: var(--primary);
        font-weight: 700;
        background: #fff;
      }
      .hint { font-size: 15px; line-height: 1.5; margin: 4px 0; }
      .seeing { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
      .presets { display: flex; gap: 10px; margin-top: 4px; }
      .presets button {
        flex: 1;
        height: 40px;
        background: #fff;
        color: var(--text);
        border: 1px solid var(--line);
      }
      .speeds { display: flex; justify-content: center; gap: 8px; align-items: center; }
      .speeds button.on { background: var(--primary); color: #fff; }
      #step { min-height: 36px; margin: 8px 0 0; font-size: 28px; font-weight: 700; }
      #step-desc { min-height: 1.4em; margin: 4px 0 8px; font-size: 18px; color: var(--primary); }
      select, input[type="range"] { font: inherit; }
      #guide {
        margin: 10px 0 0;
        max-height: 220px;
        overflow: auto;
        padding: 0;
        list-style: none;
      }
      #guide li {
        display: grid;
        grid-template-columns: 2.2em 3em 1fr;
        gap: 8px;
        padding: 8px 4px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        color: var(--muted);
      }
      #guide li.current { color: var(--text); font-weight: 700; }
      #formula { white-space: pre-wrap; color: var(--muted); font-size: 13px; }
      #success {
        display: none;
        margin: 8px 0;
        padding: 12px 14px;
        background: var(--ok);
        color: #fff;
        border-radius: 12px;
        font-weight: 700;
      }
      #success.show { display: block; }
      #photo-hint { font-size: 16px; font-weight: 700; }
      #photo-order { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      #photo-order .shot {
        display: flex;
        align-items: center;
        gap: 6px;
        height: auto;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        font-size: 13px;
      }
      #photo-order .shot.current { border-color: var(--primary); color: var(--text); font-weight: 700; }
      #photo-order .shot .dot { width: 14px; height: 14px; }
      #net, #counts { display: none; }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 14px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="screen active" id="screen-home" data-screen="home">
        <h1>跟着还原魔方</h1>
        <p class="muted">填颜色、拍照，或先练一练。</p>
        <button class="menu" type="button" data-go="paint">
          <span class="mark fill">填</span>
          <span><b>我来填色</b><span class="muted">转动魔方，点贴纸填上颜色</span></span>
        </button>
        <button class="menu" type="button" data-go="camera">
          <span class="mark cam">拍</span>
          <span><b>拍照识别</b><span class="muted">按中心色拍六个面，自动填进魔方</span></span>
        </button>
        <button class="menu" type="button" data-go="practice">
          <span class="mark practice">练</span>
          <span><b>练一练</b><span class="muted">从还原好的魔方开始，自己转，或看它怎么还原</span></span>
        </button>
      </section>

      <section class="screen" id="screen-paint" data-screen="paint">
        <button class="back" type="button" data-go="home">返回</button>
        <p class="hint" id="paint-hint">先选下面的颜色，再点魔方上的贴纸</p>
        <p class="seeing" id="paint-seeing">正在看 上面 · 前面 · 右面</p>
        <div class="stage"><canvas id="paint-view" width="640" height="640"></canvas></div>
        <div class="palette">
          <button class="chip" type="button" id="btn-photo">
            <span class="cam-dot">拍</span>
            <span>拍照</span>
          </button>
          <div id="palette" style="display:contents"></div>
        </div>
        <div class="row">
          <button class="primary grow" type="button" id="btn-solve">还原</button>
          <button class="primary grow" type="button" id="btn-continue" hidden>继续跟着转</button>
          <button type="button" id="btn-clear">重置</button>
        </div>
        <div class="presets">
          <button type="button" id="btn-sample">示例打乱</button>
          <button type="button" id="btn-solved">已还原</button>
        </div>
        <div id="net"></div>
        <p id="counts"></p>
        <div class="status-host"></div>
      </section>

      <section class="screen" id="screen-camera" data-screen="camera">
        <button class="back" type="button" id="btn-photo-cancel">返回</button>
        <div id="photo-panel">
          <p class="muted">按中心色认面：白、红、绿、黄、橙、蓝。点某一面可以单独重拍。照片只在这台设备上处理。</p>
          <div id="photo-order" aria-label="拍照顺序"></div>
          <p id="photo-hint">请拍白心面</p>
          <canvas id="photo-canvas" width="480" height="480"></canvas>
          <div class="row">
            <button class="primary" type="button" id="btn-photo-shot">拍摄这一面</button>
            <button type="button" id="btn-photo-confirm" disabled>确认识别</button>
          </div>
          <div class="row">
            <button type="button" id="btn-photo-smaller" disabled>缩小框</button>
            <button type="button" id="btn-photo-bigger" disabled>放大框</button>
            <label class="muted" id="photo-size-label">
              大小
              <input id="photo-size" type="range" min="10" max="98" value="55" disabled aria-label="九宫格大小" />
            </label>
            <button type="button" id="btn-photo-rot-left" disabled>左转</button>
            <button type="button" id="btn-photo-rot-right" disabled>右转</button>
            <button type="button" id="btn-photo-retake" disabled>重拍本面</button>
            <button type="button" id="btn-photo-next" disabled>下一张</button>
          </div>
          <input id="photo-input" type="file" accept="image/*" capture="environment" hidden />
          <p class="muted" id="photo-progress">第 1/6 张</p>
        </div>
        <div class="status-host"></div>
      </section>

      <section class="screen" id="screen-practice" data-screen="practice">
        <button class="back" type="button" data-go="home">返回首页</button>
        <p class="hint" id="prac-hint">这是还原好的魔方。按住色块，顺着那一层滑动。空白处换个角度看</p>
        <div class="stage" id="practice-stage"></div>
        <div id="prac-free">
          <div class="row">
            <button class="grow" type="button" id="prac-scramble">随机打乱</button>
            <button class="primary grow" type="button" id="prac-solve">还原</button>
          </div>
        </div>
        <div id="prac-guide" hidden>
          <div class="speeds" id="prac-speeds">
            <span class="muted">播放速度</span>
            <button type="button" data-speed="slow">低速</button>
            <button type="button" data-speed="medium" class="on">中速</button>
            <button type="button" data-speed="fast">高速</button>
          </div>
          <p class="seeing" id="prac-step"></p>
          <div class="row">
            <button class="grow" type="button" id="prac-prev">上一步</button>
            <button class="grow" type="button" id="prac-next">下一步</button>
          </div>
          <div class="row">
            <button class="grow" type="button" id="prac-back">返回</button>
            <button class="primary grow" type="button" id="prac-auto">自动</button>
          </div>
        </div>
      </section>

      <section class="screen" id="screen-follow" data-screen="follow">
        <button class="back" type="button" data-go="paint">返回填色</button>
        <p id="status">求解器准备中…</p>
        <p id="step"></p>
        <p id="step-desc"></p>
        <div class="row ops">
          <button type="button" id="btn-prev" disabled>上一步</button>
          <button type="button" id="btn-next" disabled>下一步</button>
          <button class="primary" type="button" id="btn-auto" disabled>自动</button>
          <button type="button" id="btn-restart" disabled>从头再跟</button>
          <button type="button" id="btn-view-reset">复位视角</button>
        </div>
        <div class="speeds" id="follow-speeds">
          <span class="muted">播放速度</span>
          <button type="button" data-speed="slow">低速</button>
          <button type="button" data-speed="medium" class="on">中速</button>
          <button type="button" data-speed="fast">高速</button>
        </div>
        <select id="speed" hidden aria-label="转动速度">
          <option value="slow">低速</option>
          <option value="medium" selected>中速</option>
          <option value="fast">高速</option>
        </select>
        <div id="success">还原成功</div>
        <div class="stage" id="follow-stage">
          <canvas id="view" width="640" height="640"></canvas>
        </div>
        <p class="muted" id="view-hint">拖动空白处转动视角，双击或点「复位视角」回到默认角度</p>
        <pre id="formula"></pre>
        <ol id="guide" aria-label="每一步操作说明"></ol>
      </section>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "rubik-solver": "./node_modules/rubik-solver/dist/index.mjs"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
